            - paragraph [ref=e334]: Affiliate shall publish or otherwise distribute advertisements in strict compliance with all applicable laws and regulations, including without limitation, laws prohibiting deceptive and misleading advertising and marketing, email marketing laws (including the federal CAN-SPAM Act (15 U.S.C. § 7701)), data protection laws (including but not limited to the European Union General Data Protection Regulation, U.K. Data Protection Act, California Consumer Privacy Act, and Brazilian General Data Protection Regulation), laws governing testimonials (including the FTC’s Revised Endorsements and Testimonials Guides (16 CFR Part 255 of the Code of Federal Regulations)), and all guidelines issued by the FTC. Affiliate is solely responsible for ensuring Affiliate’s compliance with all laws. Affiliates are strictly prohibited from making claims concerning the products and services offered by Jasper that are inconsistent with, or beyond the scope of marketing materials produced and made available by Jasper on their website, www.jasper.ai. Affiliate is prohibited from publishing or otherwise distributing advertisements by telemarketing, fax, or text messaging in any form to any device. Affiliate shall not offer monetary incentives, such as rewards points, cash, or prizes to prospects in return for their response to an advertisement. Affiliates may, however, offer prospects information and materials of tangible value including, but not limited to, website templates, information about e-commerce, website design, and online marketing, for reduced or no charge, but only so long as Affiliate accurately describes and delivers such information and materials to the prospect. Jasper retains the sole and exclusive discretion to determine whether Affiliate’s advertising and conduct is in compliance with all laws.
