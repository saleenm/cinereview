              - paragraph [ref=f49e170]: The Canvassador Program is a community-based ambassador program. If you’re an individual content creator who wants to be a Canva affiliate, you must first become a Canvassador.
              - paragraph [ref=f49e171]: The Canvassador Program empowers content creators to inspire and uplift people around the globe, especially within the Canva community.
              - paragraph [ref=f49e172]: Canvassadors excel at simplifying complex tasks in Canva. They create tutorials, courses, and workshops that help others understand and upskill with confidence. Program members get tools, tips, and support that make it easier to create great content.
