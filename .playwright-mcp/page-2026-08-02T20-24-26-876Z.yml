              - generic [ref=f49e284]:
                - link [ref=f49e285] [cursor=pointer]:
                  - /url: /help/promote-creator-content/
                  - generic [ref=f49e286]:
                    - paragraph [ref=f49e287]: Ways to promote your Creator templates
                    - paragraph [ref=f49e290]: Promote your Creator templates to increase exports and help you earn more. If you have an email list, include your Creator public profile link in your newsletters. Update your subscribers whenever you publish new templates. Share your templates on Instagram. Don’t forget to include a link to your Creator profile in your bio! Create content around your templates. They can be video tutorials on how to edit on Canva, or posts showing your available templates. Use Pinterest and pin your templates. Make sure to also link to your Creator profile in your bio. Share your Creator profile on Facebook groups (when relevant) so people know they can use your templates. Sign up for the Canva Affiliate program . By sharing an affiliate link, your followers get a free Canva Pro trial (with all its benefits). While earning royalties on your templates, you also get paid for referring new Canva Pro users.
                - link [ref=f49e291] [cursor=pointer]:
                  - /url: /help/canva-partnerships/
                  - generic [ref=f49e292]:
                    - paragraph [ref=f49e293]: Canva Partnerships
                    - paragraph [ref=f49e296]: Canva partners with many organizations to help us achieve our mission of empowering the world to design. We’re really grateful that you want to work with us. However, new brand, marketing, and sponsorship-related programs are currently closed. We’d still love to hear from you, though! Drop us an email at strategic-partnerships@canva.com outlining how you see us working together in the future. If you’re looking for app integrations and partnerships, see explore our page for Developers . To stay updated with the latest announcements from Canva, sign up to our Newsroom and get emails straight to your inbox. If you need help or support, visit Canva’s Help Center for solutions.
                - link [ref=f49e297] [cursor=pointer]:
                  - /url: /help/canva-creators-program/
                  - generic [ref=f49e298]:
                    - paragraph [ref=f49e299]: About the Canva Creators program
                    - paragraph [ref=f49e302]: What is the Canva Creators program? Canva Creators is on a mission to build the world's best and most diverse marketplace. It's an online space for designers, photographers, illustrators, artists, and specialists – of every experience level – to feature their work and earn royalties. Join a thriving community, explore your creativity, and earn an income doing what you love! Types of Creators Template Creators are primarily graphic designers. Element Creators can be photographers, illustrators, typographers, videographers, and audio producers. Specialty Creators know a particular niche area, e.g. Education Speciality Creators are teachers who specifically create educational resources. Share your work around the world Over 85 million Canva users across 190 countries can use the templates and elements our Creators publish to the marketplace. Talk about reach! We're on a mission to build the world's most diverse content library by creating templates and elements for everyone, everywhere. So, we encourage Creators to design in their language, incorporate their culture, and represent their country. Earn an income doing what you love If you've ever wanted to be your own boss or embark on a side hustle, Canva Creators could be for you. Once your templates or elements are on the marketplace, they’re available to all Canva users – seven days a week, 365 days a year. So even when you’re asleep, your work can be busy earning you a passive income. Canva Creators have complete creative freedom – flex your creativity, try new things, and make your mark! Creators don't have to deal with clients, deadlines, and quotas. Instead, they can focus on creating amazing designs – we'll take care of the rest. Join a thriving community When you become a Canva Creator, you join a community of like-minded creatives. There are opportunities to collaborate, level up your knowledge, and master your craft. Connecting with other Creators is a great way to build your brand and boost your creative profile. Supported by local communities across the globe, Creators are inspired, engaged, and connected through social events, educational workshops, creative talks, and design challenges. How can I apply to become a Canva Creator? The Creator application process is slightly different for Template, Element, and Speciality Creators. To apply as a Template Creator , you need to share your portfolio of work with us. You can submit your work through our application form . The Template Creator program is currently in beta, and it may take up to a couple of months to receive an answer to your application. For Element Creators - Anyone can sign up and submit elements. Due to the popularity of the program, signups for Element Creators are currently on hold. Education Specialty Creators must be verified professionals within their field. To become an Education Specialty Creator, apply through our Education Creator page . What can I sell/create as a Canva Creator? Canva Creators can create templates and elements and publish them to the marketplace. Specialty Creators use their unique knowledge to create content specific to an area, such as a school classroom. All Creators get paid every time someone uses their work in a Canva project. What are templates and elements? Templates are totally customizable layouts for presentations, social media graphics, videos, t-shirts, brochures, flyers, posters, and more. Elements are design assets that Canva users can add to their projects. These include photos, graphics and illustrations, video clips and stock footage, music and sound effects, vector art, icons, custom stickers, and more. How do I get paid for my work? As a Canva Creator, you receive royalties based on your content's performance. For templates, how much you’ll receive from the royalty pool will depend on how many template usages you have (i.e. each time a design is downloaded, printed, or presented). Creators are paid for both Free and Pro template usage. For elements, what you’ll receive from the royalty pool will depend on how many Pro element usages (exports) you have. The size of our Royalty Pool grows with Canva’s subscription revenues and is calculated every month. The exact numbers month-per-month is confidential business information. Is there a review process for content submitted? Yes. To maintain the library to the highest standard, all submissions undergo a review process. To pass review, templates and elements must meet all baseline requirements. Review Guidelines will be supplied to you once you’ve been accepted into the Creator program. What if I need help? We have our dedicated Creators Support Team for any technical issues that may arise and are always happy to assist you.
                - link [ref=f49e303] [cursor=pointer]:
                  - /url: /help/using-canvas-lms/
                  - generic [ref=f49e304]:
                    - paragraph [ref=f49e305]: Use Canva on Canvas (for teachers)
                    - paragraph [ref=f49e308]: "With your school’s Canva Education account, you can create and share designs, and set up assignments for your class directly in Canvas. Create a Canva Education account You'll need a Canva Education account to create and share designs with your class. You can do this directly from your Canvas account. Log in to your Canvas account . Go to Courses , then select Canva Education to create your account. If you can’t find the Canva Education option, please ask your district or school leader to contact us here so we can set up your entire school district on Canva. After our team approves of the application, they then have to connect Canva to Canvas before it appears on your Canvas account. Create a design Start creating designs from your Canvas account. Log in to your Canvas account and select a Course. Select Canva Education from the side panel to open a new window. Select a design document (e.g. Presentation, Worksheet, Poster, etc.). From the Canva editor, create a design using templates or from scratch. Edit text, colors, images, videos, and more. Changes to your designs save automatically. You can also create a design directly from a Canvas assignment. See the section below to learn more. Share Canva content for students Let students read and learn from your Canva presentations within Canvas. Log in to your Canvas account . Go to the Courses tab and select the course where you want to share your design. Select Pages and then the + Page button. Add page details (e.g. title, instructions etc.). Click on the App or plug icon and select Canva Education . Select the design you’ve already created or create a new one. If you created a new design, make sure to press Publish to Canvas once done. This will embed the learning content in Canvas. Click on Save & Publish to finish setting up the page. Students will see the presentation in their Canvas account. Create Canva assignments for students Canva for Campus (CCST) limitation: If your school is using Canva for Campus (CCST), Create Canva assignments for students (Submission type: External Tool ) won’t apply. Instead, use Share Canva content for Students to share Canva designs in Canvas. Log in to your Canvas account . Go to the Courses tab and select the course where you want to share your design. Select Assignments and then the + Assignment button. Scroll down to the Submission type and select External Tool Click ‘Find’ and select Canva Education Select the design you’ve already created or create a new one. If you created a new design, make sure to press Publish to Canvas once done. Optional: Select Load This Tool in a New Tab Select Save & Publish to finish setting up the assignment. Students will see the assignment in their Canvas account. Students will be given their own copy of the design that you share. They can edit it and submit it back to you for review in SpeedGrader . At the moment, your designs can only be viewed when shared on Canvas. Review student assignments in Canvas Canva for Campus (CCST) limitation: This review workflow applies to assignments created using the External Tool workflow. If you’re on CCST, use Share Canva content for Students to share Canva designs in Canvas. After students submit their assignments, you can check and grade them on Canvas. From your Canvas account, go to Assignments . Open Student submissions . Select an assignment and check the Canva design. You can only view the design. Grade and add comments to student assignments with SpeedGrader. Add banners and buttons Create banners and buttons, then add them to your Canvas account to liven it up. Log in to your Canvas account and select a Course. Go to Pages . Select or add a new page. Select the App or plug icon and select Canva Education . Search for \"Canvas Banner\" or “Canvas Button” and select a design. From the Canva editor, create the banner or buttons. Select Publish to Canvas once done. Back on Canvas, click on Save & Publish to save the changes. Want to learn more tips on using Canva Education? Check out the Canva Education Teacher Setup Guide . At the moment this guide is only available in English."
