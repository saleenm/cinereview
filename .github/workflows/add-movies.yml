name: Auto Add Movies

on:
  schedule:
    - cron: '0 3 * * *'   # كل يوم 3:00 صباحاً UTC
  workflow_dispatch:        # تشغيل يدوي من GitHub

jobs:
  add-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run auto-add script
        run: node scripts/auto-add-movies.mjs 50
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/movies.ts scripts/added-movies.json
          if git diff --staged --quiet; then
            echo "⏭️ لا أفلام جديدة للإضافة"
          else
            git commit -m "🎬 auto: add movies [$(date +'%Y-%m-%d')]"
            git push
          fi

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
