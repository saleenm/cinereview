name: Daily Push Notification

on:
  schedule:
    - cron: '0 8 * * *'   # كل يوم الساعة 8 صباحاً UTC
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily film notification
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PUSH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"title":"🎬 فيلم اليوم — CineReview","body":"اكتشف فيلم اليوم المختار بعناية لك!","url":"/ar/movie-of-day"}' \
            https://cinereview-mu.vercel.app/api/push/send
